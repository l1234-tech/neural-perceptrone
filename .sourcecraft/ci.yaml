on:
  push:
    workflows: build-and-test
  pull_request:
    workflows: build-and-test

workflows:
  build-and-test:
    tasks:
      - name: build-and-test-project
        cubes:
          - name: setup-and-build
            script:
              - apt-get update && apt-get install -y cmake g++ build-essential git
              - mkdir -p build
              - if [ -d "data" ]; then cp -r data build/; else echo "Папка data не найдена в корне!"; ls -la; fi
              - cd build && cmake ..
              - make -j4
              - echo "Проект успешно собран"
          
          - name: run-tests
            script:
              - cd build
              - chmod +x test_runner
              - ./test_runner
              - echo "Все тесты пройдены"